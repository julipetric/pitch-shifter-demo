name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/PitchShifterDemo.sln

      - name: Build
        run: dotnet build backend/PitchShifterDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/PitchShifterDemo.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (build and test, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Production build
        run: npx ng build --configuration production

      # Karma launches the Chrome preinstalled on the runner in headless mode.
      - name: Unit tests
        run: npm run test:ci

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d
        env:
          APP_PORT: 8080

      - name: Wait for the app
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check the shell, the proxied API and the processing pipeline
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q '<app-root'
          curl -fsS 'http://localhost:8080/api/audio/metadata?tempoPercent=80' | grep -q processedDurationSeconds

          curl -fsS -D headers.txt -o processed.mp3 \
            'http://localhost:8080/api/audio/stream?tempoPercent=80&pitchSemitones=3'
          grep -qi '^content-type: audio/mpeg' headers.txt
          size=$(stat -c %s processed.mp3)
          echo "processed stream: ${size} bytes"
          test "$size" -gt 100000

          status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/audio/stream?tempoPercent=10')
          test "$status" = 400

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
