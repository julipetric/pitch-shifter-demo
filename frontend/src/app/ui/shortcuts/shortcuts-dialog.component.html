<h2 id="shortcuts-title" class="title">Keyboard shortcuts</h2>
<dl class="list">
  <div><dt><kbd>Space</kbd> <kbd>K</kbd></dt><dd>Play or pause</dd></div>
  <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Back or forward 5 seconds</dd></div>
  <div><dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>Pitch down or up a semitone</dd></div>
  <div><dt><kbd>−</kbd> <kbd>+</kbd></dt><dd>Tempo down or up 5%</dd></div>
  <div><dt><kbd>1</kbd> – <kbd>6</kbd></dt><dd>Presets</dd></div>
  <div><dt><kbd>0</kbd></dt><dd>Back to the original</dd></div>
  <div><dt><kbd>M</kbd></dt><dd>Mute</dd></div>
  <div><dt><kbd>?</kbd></dt><dd>Show this list</dd></div>
</dl>
<p class="note">Drag a knob up or down, scroll over it, or use the arrow keys. Double-click resets it.</p>
