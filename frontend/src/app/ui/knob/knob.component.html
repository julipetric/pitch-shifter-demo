<div class="label-row">
  <span class="label">{{ label() }}</span>
  @if (resettable()) {
    <button
      type="button"
      class="reset"
      [attr.aria-label]="'Reset ' + label()"
      [title]="'Reset ' + label() + ', or double-click the dial'"
      (click)="onResetClick()"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M3.67 5.5A5 5 0 1 1 3.17 9.29" />
        <path d="M2.9 2.6 3.67 5.5 6.57 4.72" />
      </svg>
    </button>
  }
</div>

<div
  #dial
  class="dial"
  role="slider"
  aria-orientation="vertical"
  [attr.tabindex]="disabled() ? -1 : 0"
  [attr.aria-label]="label()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="value()"
  [attr.aria-valuetext]="ariaValueText()"
  [attr.aria-disabled]="disabled() || null"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
  (lostpointercapture)="onPointerEnd($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  (blur)="onBlur()"
  (dblclick)="reset()"
>
  <svg class="face" viewBox="0 0 100 90" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient [attr.id]="paint.body.id" cx="50%" cy="22%" r="82%">
        <stop offset="0" class="body-light" />
        <stop offset="1" class="body-dark" />
      </radialGradient>
      <linearGradient [attr.id]="paint.rim.id" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="rim-light" />
        <stop offset="1" class="rim-dark" />
      </linearGradient>
      <filter [attr.id]="paint.glow.id" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="110">
        <feGaussianBlur stdDeviation="2.4" />
      </filter>
      <filter [attr.id]="paint.shadow.id" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <feGaussianBlur stdDeviation="1.8" />
      </filter>
    </defs>

    <path class="tick tick-minor" [attr.d]="ticks().minor" />
    <path class="tick tick-end" [attr.d]="ticks().ends" />
    <path class="tick tick-neutral" [attr.d]="ticks().neutral" />

    <path class="track" [attr.d]="trackPath" />
    @if (valuePath(); as arc) {
      <path class="value-glow" [attr.d]="arc" [attr.filter]="paint.glow.url" />
      <path class="value" [attr.d]="arc" />
    }

    <circle class="focus-ring" cx="50" cy="50" r="35.75" />
    <circle class="cap-shadow" cx="50" cy="52" r="32" [attr.filter]="paint.shadow.url" />
    <g class="cap">
      <circle class="cap-body" cx="50" cy="50" r="32.5" [attr.fill]="paint.body.url" />
      <circle class="cap-rim" cx="50" cy="50" r="32" [attr.stroke]="paint.rim.url" />
      <g [attr.transform]="pointerTransform()">
        <line class="pointer" x1="50" y1="38" x2="50" y2="22.5" />
        <circle class="pointer-tip" cx="50" cy="22.5" r="1.9" />
      </g>
    </g>
  </svg>
</div>

<div class="readout">{{ readout() }}</div>
<div class="caption">{{ caption() }}</div>
